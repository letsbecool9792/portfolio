<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- No title, description, robots, canonical, OG or Twitter tags in this
		     file. They are rendered per-route by src/components/Seo.tsx, hoisted
		     into this head by React 19, then baked into each route's HTML file by
		     scripts/prerender.mjs.

		     A hardcoded title element here would *win* over the hoisted one —
		     browsers honour the first one in document order — and a static
		     canonical or og:url would point all 13 routes at the homepage.

		     Add page metadata to src/content/seo.ts, never to this file.
		     (Tag names are spelled out rather than written as markup so a grep for
		     the real elements doesn't keep matching this comment.) -->

		<!-- Google won't show a favicon beside a search result unless it's a
		     multiple of 48px; the old 16x16-only .ico got a generic globe.
		     All three are exact integer upscales of the same pixel art. -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- The Person + WebSite JSON-LD used to live here. It now renders per-route
		     from src/content/schema.ts via <Seo>, so `/` can declare itself a
		     ProfilePage about the Person and each chapter an Article by him — things
		     one shared shell could never say. scripts/prerender.mjs lifts the script
		     into this head, so it survives on the forked pages too. -->
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
